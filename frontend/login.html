<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ResumeAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span>⚡ Resume<span style="color: var(--primary);">AI</span></span>
        <span class="logo-badge">Pro</span>
      </a>
      <div class="nav-actions">
        <a href="database.html" class="nav-link" style="margin-right: 8px; font-size: 0.9rem;">🗄️ Database</a>
        <button class="theme-btn theme-toggle-btn" title="Toggle Theme">☀️</button>
        <a href="register.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Login Container -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your resume analysis dashboard</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" title="Toggle password visibility">👁️</button>
          </div>
          <div id="login-error" class="form-error"></div>
        </div>

        <div class="auth-extra">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="remember-me" checked> Remember me
          </label>
          <a href="#" onclick="alert('Password reset link has been simulated.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
