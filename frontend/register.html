<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ResumeAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span>⚡ Resume<span style="color: var(--primary);">AI</span></span>
        <span class="logo-badge">Pro</span>
      </a>
      <div class="nav-actions">
        <button class="theme-btn theme-toggle-btn" title="Toggle Theme">☀️</button>
        <a href="login.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Register Container -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Get started with AI resume analysis & semantic matching</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="register-name" class="form-label">Full Name</label>
          <input type="text" id="register-name" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address</label>
          <input type="email" id="register-email" class="form-input" placeholder="alex.morgan@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="register-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle" title="Toggle password visibility">👁️</button>
          </div>
          <div class="password-strength">
            <div id="password-strength-bar" class="password-strength-bar"></div>
          </div>
          <div id="register-error" class="form-error"></div>
        </div>

        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: left;">
          By registering, you agree to our Terms of Service & Privacy Policy.
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 6px;">
          Create Free Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
